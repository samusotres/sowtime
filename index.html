<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sowtime</title>
<meta name="description" content="What to plant this month, anywhere in the world. Enter your location and how much sun your garden gets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a seed-packet almanac. Setup panel on top, packet-style plant cards below, each with the sow/harvest month strip printed on the back of real seed packets. */
:root {
  --bg: #f3f5ef;
  --surface: #ffffff;
  --surface-2: #eaeee6;
  --ink: #1c2a21;
  --muted: #5b685f;
  --line: #d8dfd4;
  --accent: #2d6a43;
  --accent-ink: #ffffff;
  --sun: #d99412;
  --sow: #3a8a55;
  --indoor: #3577a0;
  --seedling: #a07c12;
  --plant: #8a5a3b;
  --harvest: #b0436a;
  --frost: #4f8fbf;
  --hot: #c4552d;
  --veg: #3a8a55; --herb: #4a8f86; --fruit: #b0436a; --flower: #8f5bb5;
  --shadow: 0 1px 2px rgba(28,42,33,.06), 0 6px 18px rgba(28,42,33,.07);
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111713; --surface: #18201b; --surface-2: #212b24; --ink: #e4ebe3; --muted: #9ba79e; --line: #2c3830;
  --accent: #74c38f; --accent-ink: #0d1a12; --sun: #f0b43c; --sow: #66b882; --indoor: #69a9d2; --seedling: #d1ad45;
  --plant: #c08b66; --harvest: #e07399; --frost: #7fb6dd; --hot: #e37c55;
  --veg: #66b882; --herb: #6fb7ad; --fruit: #e07399; --flower: #b88ad8;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.28); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111713; --surface: #18201b; --surface-2: #212b24; --ink: #e4ebe3; --muted: #9ba79e; --line: #2c3830;
  --accent: #74c38f; --accent-ink: #0d1a12; --sun: #f0b43c; --sow: #66b882; --indoor: #69a9d2; --seedling: #d1ad45;
  --plant: #c08b66; --harvest: #e07399; --frost: #7fb6dd; --hot: #e37c55;
  --veg: #66b882; --herb: #6fb7ad; --fruit: #e07399; --flower: #b88ad8;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.28); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Header */
.top { padding-block: 18px 6px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 34px; height: 34px; }
.brand h1 { font-size: 28px; line-height: 1; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.prefs { display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
select.lang { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px; font-size: 13px; font-weight: 600; }

/* Setup panel */
.setup { grid-template-columns: minmax(0, 1fr); margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 18px; }
@media (min-width: 900px) { .setup { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 22px 28px; padding: 22px 24px; } .setup .months-row { grid-column: 1 / -1; } }
.field { min-width: 0; }
.field > label, .field > .lbl { display: block; font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.search { position: relative; }
.search-box { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: var(--r); padding: 0 6px 0 12px; background: var(--bg); transition: border-color .15s; }
.search-box:focus-within { border-color: var(--accent); }
.search-box input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 12px 0; font-size: 16px; }
.btn-loc { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--surface-2); padding: 8px 10px; border-radius: 9px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.btn-loc:hover { background: var(--line); }
@media (max-width: 420px) { .btn-loc span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } }
.suggest { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); max-height: 320px; overflow-y: auto; padding: 6px; }
.suggest button { display: flex; width: 100%; text-align: left; gap: 10px; align-items: center; border: 0; background: transparent; padding: 9px 10px; border-radius: 8px; }
.suggest button:hover, .suggest button.on { background: var(--surface-2); }
.suggest small { color: var(--muted); }
.suggest .note { padding: 8px 10px; font-size: 13px; color: var(--muted); }
.suggest .tag { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.place-line { margin-top: 8px; font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.place-line strong { color: var(--ink); font-weight: 600; }
.pill-demo { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: color-mix(in srgb, var(--sun) 22%, transparent); color: var(--ink); padding: 2px 7px; border-radius: 999px; }

.suns { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
@media (min-width: 520px) { .suns { grid-template-columns: repeat(4, minmax(0,1fr)); } }
.sun-opt { border: 1.5px solid var(--line); background: var(--bg); border-radius: var(--r); padding: 10px; text-align: left; display: grid; gap: 4px; transition: border-color .15s, background .15s; }
.sun-opt svg { width: 30px; height: 30px; }
.sun-opt b { font-size: 14px; }
.sun-opt span { font-size: 12px; color: var(--muted); line-height: 1.3; }
.sun-opt[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.hint { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

.months { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 700px) { .months { grid-template-columns: repeat(12, minmax(0, 1fr)); } }
.months button { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 0 6px; font-weight: 600; font-size: 14px; display: grid; justify-items: center; gap: 1px; }
.months button small { font-size: 10px; font-weight: 600; color: var(--muted); height: 13px; line-height: 13px; }
.months button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.months button[aria-pressed="true"] small { color: var(--accent-ink); opacity: .85; }

/* Summary */
.summary { margin-top: 22px; display: grid; gap: 14px; }
.summary h2 { font-size: clamp(24px, 3.6vw, 34px); line-height: 1.15; }
.summary h2 em { font-style: normal; color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 760px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; font-weight: 600; }
.stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.stat .s { font-size: 12.5px; color: var(--muted); }
.chip-frost { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
.lv0 { background: color-mix(in srgb, var(--sow) 16%, transparent); color: var(--sow); }
.lv1 { background: color-mix(in srgb, var(--frost) 16%, transparent); color: var(--frost); }
.lv2, .lv3 { background: color-mix(in srgb, var(--frost) 26%, transparent); color: var(--frost); }
.status { font-size: 14px; color: var(--muted); }
.status.err { color: var(--hot); }

/* Tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); margin-top: 18px; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--bg); }
.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: transparent; padding: 12px 12px 11px; font-weight: 600; color: var(--muted); border-bottom: 2.5px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .count { font-variant-numeric: tabular-nums; background: var(--surface-2); border-radius: 999px; padding: 0 7px; margin-left: 4px; font-size: 12px; }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding-block: 16px 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.find { margin-left: auto; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0 12px; min-width: 0; flex: 1 1 180px; max-width: 280px; }
.find input { border: 0; outline: 0; background: transparent; padding: 7px 0; min-width: 0; flex: 1; font-size: 14px; }
@media (max-width: 640px) { .find { margin-left: 0; max-width: none; flex-basis: 100%; } }

/* Plant cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 272px), 1fr)); gap: 12px; padding-block: 8px 12px; }
.card { position: relative; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px; transition: transform .12s, box-shadow .12s, border-color .12s; min-width: 0; }
.card:hover { transform: translateY(-1px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.card::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 3px; border-radius: 0 0 3px 3px; background: var(--c, var(--veg)); }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card-h h3 { font-size: 19px; line-height: 1.2; }
.sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.sub i { font-style: italic; }
.rate { flex: none; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
.rate.ideal { background: color-mix(in srgb, var(--sow) 18%, transparent); color: var(--sow); }
.rate.good { background: color-mix(in srgb, var(--seedling) 20%, transparent); color: var(--seedling); }
.rate.possible { background: var(--surface-2); color: var(--muted); }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.act { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 3px 9px 3px 7px; border-radius: 8px; background: color-mix(in srgb, var(--a) 13%, transparent); color: var(--ink); }
.act svg { width: 15px; height: 15px; color: var(--a); }
.harv { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.harv b { color: var(--ink); font-weight: 600; }
.strip { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 2px; margin-top: auto; }
.strip .b { height: 6px; border-radius: 2px; background: var(--surface-2); }
.strip .m { font-size: 9.5px; text-align: center; color: var(--muted); line-height: 1.2; padding-top: 2px; font-weight: 600; }
.strip .m.now { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 14px; }

/* Later list */
.later { margin-block: 20px 8px; border-top: 1px solid var(--line); padding-top: 16px; }
.later summary { cursor: pointer; font-weight: 700; font-size: 16px; list-style: none; display: flex; align-items: center; gap: 8px; }
.later summary::-webkit-details-marker { display: none; }
.later summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
.later[open] summary::before { transform: rotate(45deg); }
.later-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 2px 18px; margin-top: 12px; }
.later-list button { display: flex; justify-content: space-between; gap: 10px; border: 0; background: transparent; text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 14px; min-width: 0; }
.later-list button:hover { background: var(--surface-2); }
.later-list span:last-child { color: var(--muted); font-size: 13px; text-align: right; }

/* Year planner */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); padding-block: 4px 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); margin-bottom: 12px; }
table.year { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 720px; font-size: 13px; }
table.year th, table.year td { padding: 0; border-bottom: 1px solid var(--line); }
table.year thead th { position: sticky; top: 0; background: var(--surface); font-size: 11.5px; color: var(--muted); padding: 8px 2px; font-weight: 700; text-align: center; }
table.year thead th.now { color: var(--accent); }
table.year th.name { position: sticky; left: 0; z-index: 2; background: var(--surface); text-align: left; padding: 7px 10px; min-width: 150px; max-width: 190px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.year th.name button { border: 0; background: none; padding: 0; font-weight: 600; text-align: left; }
table.year td { text-align: center; padding: 4px 2px; }
.cell { display: grid; gap: 2px; }
.cell i { height: 9px; border-radius: 2px; background: transparent; display: block; }
table.year td.now { background: color-mix(in srgb, var(--accent) 6%, transparent); }

/* Climate */
.climate { display: grid; gap: 16px; padding-block: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.panel h3 { font-size: 18px; margin-bottom: 4px; }
.panel p { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; max-width: 70ch; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 11px; }
.ctable { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 640px; }
.ctable th, .ctable td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.ctable th:first-child, .ctable td:first-child { text-align: left; }
.ctable thead th { color: var(--muted); font-size: 12px; }
.ctable tr.now td { background: color-mix(in srgb, var(--accent) 8%, transparent); font-weight: 600; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 12, .45); z-index: 50; }
.sheet { position: fixed; z-index: 51; left: 0; right: 0; bottom: 0; max-height: 92%; background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.25); overflow-y: auto; padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); animation: up .22s ease-out; }
@media (min-width: 900px) { .sheet { left: auto; top: 0; bottom: 0; width: 520px; max-height: none; border-radius: 0; padding-top: env(safe-area-inset-top, 0px); animation: slide .22s ease-out; } }
@keyframes up { from { transform: translateY(30px); opacity: .6; } }
@keyframes slide { from { transform: translateX(30px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .sheet, .card { animation: none; transition: none; } }
.sheet-head { position: sticky; top: 0; background: var(--surface); padding: 14px 0 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; border-bottom: 1px solid var(--line); z-index: 1; }
.sheet-head h2 { font-size: 26px; line-height: 1.15; }
.close { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.sheet section { padding-top: 16px; }
.sheet h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sheet p { margin: 0 0 8px; max-width: 65ch; }
.notes { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.fact { background: var(--bg); border-radius: 10px; padding: 9px 11px; min-width: 0; }
.fact span { display: block; font-size: 11.5px; color: var(--muted); font-weight: 600; }
.fact b { font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.packet { border: 1.5px dashed var(--line); border-radius: 12px; padding: 12px; }
.packet .row { display: grid; grid-template-columns: 74px repeat(12, minmax(0, 1fr)); gap: 2px; align-items: center; }
.packet .row + .row { margin-top: 4px; }
.packet .row span { font-size: 11.5px; font-weight: 600; color: var(--muted); }
.packet .row i { height: 14px; border-radius: 3px; background: var(--surface-2); display: block; }
.packet .row em { font-style: normal; font-size: 10px; text-align: center; color: var(--muted); font-weight: 700; }
.packet .row em.now { color: var(--accent); }
.names { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.names b { color: var(--ink); font-weight: 600; }
.comp { display: flex; flex-wrap: wrap; gap: 6px; }
.src { font-size: 12px; color: var(--muted); }

/* Footer */
footer { margin-top: 30px; border-top: 1px solid var(--line); padding-block: 20px 34px; color: var(--muted); font-size: 12.5px; }
footer p { margin: 0 0 8px; max-width: 90ch; }
footer a { color: inherit; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); }

/* Year planner: compact on phones */
table.year col.cname { width: 170px; }
table.year th.name button { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; line-height: 1.25; }
table.year .mini { display: none; }
@media (max-width: 640px) {
  table.year { min-width: 0; table-layout: fixed; }
  table.year col.cname { width: 92px; }
  table.year th.name { min-width: 0; max-width: none; white-space: normal; padding: 6px 6px 6px 8px; font-size: 12.5px; }
  table.year thead th { font-size: 10.5px; padding: 6px 0; }
  table.year td { padding: 3px 1px; }
  table.year .mfull { display: none; }
  table.year .mini { display: inline; }
  .cell i { height: 8px; }
}
</style>
</head>

<script>/* Planting engine: decides what can be sown or planted in a given month, for a given climate and garden.
   Climate input: monthly arrays (Jan..Dec) of mean daily max/min temperature (°C), precipitation (mm/month)
   and sunshine fraction (share of daylight hours that are sunny). */
(function (root) {
  "use strict";
  var DAYS = [31, 28.25, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  var MID = [15, 45, 74, 105, 135, 166, 196, 227, 258, 288, 319, 349];

  /* Garden light options: hours of direct sun on a clear midsummer day. */
  var SUN_OPTIONS = {
    full: { hours: 8, label: "Full sun", hint: "6+ hours of direct sun" },
    part: { hours: 5, label: "Part sun", hint: "4–6 hours" },
    partshade: { hours: 3, label: "Part shade", hint: "2–4 hours" },
    shade: { hours: 1, label: "Shade", hint: "Under 2 hours" }
  };
  var NEED_HOURS = { full: 6, partial: 3, shade: 1 };

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function dayLength(lat, doy) {
    var p = Math.asin(0.39795 * Math.cos(0.2163108 + 2 * Math.atan(0.9671396 * Math.tan(0.0086 * (doy - 186)))));
    var phi = lat * Math.PI / 180;
    var x = (Math.sin(0.8333 * Math.PI / 180) + Math.sin(phi) * Math.sin(p)) / (Math.cos(phi) * Math.cos(p));
    return 24 - (24 / Math.PI) * Math.acos(clamp(x, -1, 1));
  }

  /* Build the garden-specific monthly climate. */
  function gardenClimate(climate, sunKey) {
    var opt = SUN_OPTIONS[sunKey] || SUN_OPTIONS.full;
    var H = opt.hours;
    var dl = MID.map(function (d) { return dayLength(climate.lat, d); });
    var dlMax = Math.max.apply(null, dl);
    var shiftMax = clamp((H - 6) * 0.5, -2.5, 1.5);      // shaded beds stay cooler by day
    var soilShift = H >= 6 ? 1 : H >= 3 ? 0 : -1;        // sunny soil warms faster
    var g = { lat: climate.lat, sunKey: sunKey, sunHours: H, shiftMax: shiftMax, dl: dl,
              tmax: [], tmin: [], tmean: [], soil: [], prcp: climate.prcp.slice(), sunFrac: climate.sunFrac.slice(),
              gardenSun: [], openSun: [] };
    for (var m = 0; m < 12; m++) {
      var tmax = climate.tmax[m] + shiftMax, tmin = climate.tmin[m];
      g.tmax.push(tmax); g.tmin.push(tmin);
      g.tmean.push(climate.tmean && climate.tmean[m] != null ? climate.tmean[m] + shiftMax / 2 : (tmax + tmin) / 2);
      g.soil.push((tmax + tmin) / 2 + soilShift);
      var clearHours = Math.min(H * dl[m] / dlMax, dl[m]);
      g.gardenSun.push(clearHours * climate.sunFrac[m]);
      g.openSun.push(dl[m] * climate.sunFrac[m]);
    }
    g.coldest = Math.min.apply(null, g.tmean);
    g.hottest = Math.max.apply(null, g.tmean);
    g.minTmin = Math.min.apply(null, g.tmin);
    return g;
  }

  function frostRisk(tmin) {
    if (tmin <= -2) return { level: 3, label: "Hard frost" };
    if (tmin <= 2) return { level: 2, label: "Frost likely" };
    if (tmin <= 5) return { level: 1, label: "Light frost possible" };
    return { level: 0, label: "Frost-free" };
  }

  /* ---------- per-plant rules ---------- */
  function survives(p, g, m) {
    if (p.frost === "tender") return g.tmin[m] >= 5;
    return g.tmin[m] - 5 >= p.minSurvive;
  }
  function plantOutOK(p, g, m) {
    var need = { tender: 9, half_hardy: 1, hardy: -3, very_hardy: -6 }[p.frost];
    return g.tmin[m] >= need && g.tmean[m] >= p.grow[0] && g.tmean[m] <= p.grow[3];
  }
  function germOK(p, g, m) {
    if (!p.germ) return false;
    var s = g.soil[m];
    if (s < p.germ[0] || s > p.germ[2] + 8) return false;
    if (p.frost === "tender" && g.tmin[m] < 7) return false;
    return g.tmin[m] - 5 >= p.minSurvive || p.frost === "tender";
  }
  function factor(p, g, m) {
    var t = g.tmean[m], gr = p.grow, f;
    if (t > gr[3]) return { f: -1, why: "hot" };
    if (t < gr[0]) return { f: 0, why: "cold" };
    if (t < gr[1]) f = 0.35 + 0.65 * (t - gr[0]) / (gr[1] - gr[0]);
    else if (t <= gr[2]) f = 1;
    else f = 1 - 0.6 * (t - gr[2]) / (gr[3] - gr[2]);
    var heat = false, bolt = false;
    if (g.tmax[m] > gr[3] + 5) { f *= 0.6; heat = true; }
    else if (g.tmax[m] > gr[2] + 6) { f *= 0.75; heat = true; }
    if (p.daylength === "long" && g.dl[m] > 14 && t > gr[1]) { f *= 0.65; bolt = true; }
    return { f: f, heat: heat, bolt: bolt };
  }

  /* Walk the calendar from month s until `days` of effective growth have accumulated. */
  function walk(p, g, s, days) {
    var grown = 0, sumF = 0, n = 0, flags = {};
    var canPause = p.frost === "hardy" || p.frost === "very_hardy";
    for (var i = 0; i < 13; i++) {
      var m = (s + i) % 12;
      if (!survives(p, g, m)) return { ok: false, why: "frost" };
      var r = factor(p, g, m);
      if (r.f < 0) return { ok: false, why: "hot" };
      if (r.f === 0) {
        if (!canPause || grown < 25) return { ok: false, why: "cold" };
        flags.overwinter = true;
        continue;
      }
      if (r.heat) flags.heat = true;
      if (r.bolt) flags.bolt = true;
      if (g.prcp[m] < 25) flags.dry = true;
      var monthDays = i === 0 ? DAYS[m] / 2 : DAYS[m];   // sown or planted mid-month
      if (grown + monthDays * r.f >= days) {
        var frac = (days - grown) / (monthDays * r.f);
        sumF += r.f * frac; n += frac;
        return { ok: true, end: m, months: i + frac, q: sumF / n, flags: flags };
      }
      grown += monthDays * r.f; sumF += r.f; n += 1;
    }
    return { ok: false, why: "cold" };
  }

  function harvestWindow(p, g, s, extraFromSeed) {
    var a = walk(p, g, s, Math.max(10, p.dtm[0] - extraFromSeed));
    if (!a.ok) return a;
    var b = walk(p, g, s, Math.max(10, p.dtm[1] - extraFromSeed));
    var res = { ok: true, q: a.q, flags: a.flags, from: a.end, to: b.ok ? b.end : a.end };
    if (b.ok) { res.q = (a.q + b.q) / 2; for (var k in b.flags) res.flags[k] = true; }
    return res;
  }

  function sunFactor(p, g) {
    var need = NEED_HOURS[p.sun] || 6, H = g.sunHours;
    if (H >= need) return (p.sun === "shade" && H >= 7 && g.hottest > 18) ? 0.8 : 1;
    if (H >= need * 0.6) return 0.75;
    return 0;
  }

  function isPerennialMode(p) { return p.dtm[0] >= 300 || (p.cycle === "perennial" && p.dtm[1] > 300); }
  function isAutumnBulb(p) { return p.chill && p.methods.indexOf("P") >= 0 && p.cycle === "perennial" && p.dtm[0] >= 150 && p.dtm[1] <= 300; }

  function perennialSite(p, g) {
    if (g.hottest > p.grow[3]) return { ok: false, why: "hot" };
    if (g.minTmin - 6 < p.minSurvive) return { ok: false, why: "winter_cold" };
    var lowChill = false;
    if (p.chill) {
      if (g.coldest > 14) return { ok: false, why: "winter_warm" };
      if (g.coldest > 10) lowChill = true;
    }
    var good = 0;
    for (var m = 0; m < 12; m++) { var r = factor(p, g, m); if (r.f >= 0.5) good++; }
    if (good < 3) return { ok: false, why: "cold" };
    return { ok: true, q: Math.min(1, 0.45 + good / 12), lowChill: lowChill };
  }

  /* Evaluate one plant for one start month. Returns {actions:[...], q, notes, why} */
  function evaluate(p, g, m) {
    var sf = sunFactor(p, g);
    var res = { actions: [], q: 0, notes: [], why: null, sun: sf };
    var M = p.methods;
    var k = p.indoorWeeks ? Math.max(1, Math.round(p.indoorWeeks / 4.35)) : 0;

    if (isAutumnBulb(p)) {
      var cold = g.coldest, lowChill = false, okMonth = false;
      if (g.minTmin - 5 < p.minSurvive) { res.why = "winter_cold"; return res; }
      if (cold <= 10) {
        okMonth = g.tmean[m] <= 14 && g.tmean[(m + 1) % 12] < g.tmean[m] && g.tmin[m] >= -3;
      } else if (cold <= 16) {
        lowChill = true;
        okMonth = g.tmean[m] <= Math.min(20, cold + 3) && g.tmean[(m + 1) % 12] <= g.tmean[m] + 0.5;
      } else { res.why = "winter_warm"; return res; }
      if (okMonth) {
        var avg = (p.dtm[0] + p.dtm[1]) / 2;
        var h = Math.round((m + avg / 30.4)) % 12;
        res.actions.push({ type: "plant", from: h, to: (h + 1) % 12, q: lowChill ? 0.5 : 0.9 });
        if (lowChill) res.notes.push("n_chillbulb");
      } else res.why = "season";
    } else if (isPerennialMode(p)) {
      var site = perennialSite(p, g);
      if (!site.ok) { res.why = site.why; return res; }
      var mild = g.tmean[m] >= Math.max(p.grow[0], 4) && g.tmean[m] <= p.grow[2] + 2 && g.tmin[m] >= -2;
      var first = { from: null, to: null, firstDays: p.dtm[0] };
      if (mild) {
        if (M.indexOf("P") >= 0) res.actions.push(Object.assign({ type: "plant", q: site.q }, first));
        if (M.indexOf("T") >= 0 && M.indexOf("P") < 0) res.actions.push(Object.assign({ type: "seedling", q: site.q }, first));
      }
      if (M.indexOf("D") >= 0 && germOK(p, g, m) && mild) res.actions.push(Object.assign({ type: "sow", q: site.q * 0.9 }, first));
      if (M.indexOf("I") >= 0) {
        var t = (m + k) % 12;
        if (g.tmean[t] >= Math.max(p.grow[0], 4) && g.tmean[t] <= p.grow[2] + 2 && plantOutOK(p, g, t))
          res.actions.push(Object.assign({ type: "indoor", q: site.q * 0.9, plantOut: t }, first));
      }
      if (site.lowChill) res.notes.push("n_lowchill");
      if (!res.actions.length) res.why = "season";
    } else {
      var seedDays = p.dtmFrom === "transplant" ? 0 : (p.indoorWeeks || 4) * 7;
      if (M.indexOf("D") >= 0 && germOK(p, g, m)) {
        var extra = p.dtmFrom === "transplant" ? -20 : 0; // direct-sown transplant crops need longer
        var w = harvestWindow(p, g, m, extra);
        if (w.ok) res.actions.push({ type: "sow", from: w.from, to: w.to, q: w.q, flags: w.flags });
      }
      if (M.indexOf("I") >= 0) {
        var t2 = (m + k) % 12;
        if (plantOutOK(p, g, t2)) {
          var w2 = harvestWindow(p, g, t2, p.dtmFrom === "transplant" ? 0 : p.indoorWeeks * 7);
          if (w2.ok) res.actions.push({ type: "indoor", plantOut: t2, from: w2.from, to: w2.to, q: w2.q * 0.97, flags: w2.flags });
        }
      }
      if ((M.indexOf("T") >= 0 || M.indexOf("I") >= 0) && plantOutOK(p, g, m)) {
        var w3 = harvestWindow(p, g, m, seedDays);
        if (w3.ok) res.actions.push({ type: "seedling", from: w3.from, to: w3.to, q: w3.q, flags: w3.flags });
      }
      if (M.indexOf("P") >= 0) {
        var soilMin = p.soilMin != null ? p.soilMin : p.grow[0];
        if (g.soil[m] >= soilMin && plantOutOK(p, g, m)) {
          var w4 = harvestWindow(p, g, m, 0);
          if (w4.ok) res.actions.push({ type: "plant", from: w4.from, to: w4.to, q: w4.q, flags: w4.flags });
        }
      }
      if (!res.actions.length) res.why = "season";
    }

    if (res.actions.length) {
      res.q = Math.max.apply(null, res.actions.map(function (a) { return a.q; })) * sf;
      var fl = {};
      res.actions.forEach(function (a) { for (var x in (a.flags || {})) fl[x] = true; });
      if (fl.heat) res.notes.push("n_heat");
      if (fl.bolt) res.notes.push("n_bolt");
      if (fl.dry) res.notes.push("n_dry");
      if (fl.overwinter) res.notes.push("n_overwinter");
      if (sf === 0) { res.why = "sun"; }
      else if (sf < 1 && p.sun === "shade") res.notes.push("n_shade");
      else if (sf < 1) res.notes.push("n_lesssun");
      if (res.q < 0.3 && sf > 0) { res.why = "marginal"; }
    }
    return res;
  }

  function rating(q) { return q >= 0.85 ? "ideal" : q >= 0.6 ? "good" : "possible"; }

  function yearPlan(p, g) {
    var months = [];
    for (var m = 0; m < 12; m++) months.push(evaluate(p, g, m));
    return months;
  }

  /* Explain why a plant isn't plantable this month: next good month, or a site-level reason. */
  function explain(p, g, m, plan) {
    plan = plan || yearPlan(p, g);
    for (var i = 1; i < 12; i++) {
      var mm = (m + i) % 12, e = plan[mm];
      if (e.actions.length && !e.why) return { next: mm, action: e.actions[0].type };
    }
    var e0 = plan[m];
    var why = e0.why;
    if (why === "season" || why === "marginal") {
      why = g.hottest > p.grow[3] && g.coldest > p.grow[1] ? "hot" : "cold";
    }
    return { why: why };
  }

  function prepare(p) {
    // Accept the compact plant record used in the page.
    return p;
  }

  var api = { SUN_OPTIONS: SUN_OPTIONS, NEED_HOURS: NEED_HOURS, dayLength: dayLength, gardenClimate: gardenClimate,

  function notNowText(p) {

    return { txt: T("why_" + ex.why) !== "why_" + ex.why ? T("why_" + ex.why) : T("why_none"), soon: 99, ex: ex };

  function renderNow() {

      if (i === S.month) s += '<rect x="' + (x(i) - (W - L0 - R) / 24) + '" y="' + T0 + '" width="' + ((W - L0 - R) / 12) + '" height="' + (H - T0 - B) + '" fill="var(--accent)" opacity=".07"/>';
      s += '<text x="' + x(i) + '" y="' + (H - 12) + '" text-anchor="middle"' + (i === S.month ? nowStyle : "") + ">" + esc(ML(i)) + "</text>";

    if (!G) { $("v-year").innerHTML = ""; $("v-clim").innerHTML = ""; }
    ["now", "year", "clim"].forEach(function (k) { $("v-" + k).hidden = S.tab !== k; $("t-" + k).setAttribute("aria-selected", String(S.tab === k)); });
    $("u-c").setAttribute("aria-pressed", String(S.unit === "C")); $("u-f").setAttribute("aria-pressed", String(S.unit === "F"));
    if (openId) openPlant(openId, true);
  }

  var toastTimer;
  function toast(msg) {
    var el = document.querySelector(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
    el.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.remove(); }, 4200);
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("button, [data-close]");
    if (!b) { if (!ev.target.closest(".search")) closeSuggest(); return; }
    if (b.dataset.close) { closeSheet(); return; }
    if (b.dataset.sun) { S.sun = b.dataset.sun; store("sun", S.sun); recompute(); renderAll(); return; }
    if (b.dataset.month != null) { S.month = +b.dataset.month; renderAll(); return; }
    if (b.dataset.cat) { S.cat = b.dataset.cat; renderAll(); return; }
    if (b.dataset.act) { S.act = b.dataset.act; renderAll(); return; }
    if (b.dataset.i != null && b.closest("#suggest")) { setPlace(sugItems[+b.dataset.i]); return; }
    if (b.dataset.id) { var inSheet = !!b.closest(".sheet"); openPlant(b.dataset.id, inSheet); return; }
    if (b.id === "retry" && S.place) { setPlace(S.place); return; }
    if (b.id === "u-c" || b.id === "u-f") { S.unit = b.id === "u-c" ? "C" : "F"; store("unit", S.unit); renderAll(); return; }
    if (b.getAttribute("role") === "tab") { S.tab = b.id.slice(2); renderAll(); return; }
    if (b.id === "locate") { locate(); return; }
    if (!b.closest(".search")) closeSuggest();
  });
  $("q").addEventListener("input", onSearchInput);
  $("q").addEventListener("focus", function () { onSearchInput(); });
  $("q").addEventListener("keydown", function (ev) {
    var box = $("suggest"); if (box.hidden) return;
    var btns = box.querySelectorAll("button");
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault(); if (!btns.length) return; sugIdx = (sugIdx + (ev.key === "ArrowDown" ? 1 : -1) + btns.length) % btns.length;
      btns.forEach(function (x, i) { x.classList.toggle("on", i === sugIdx); });
    } else if (ev.key === "Enter") {
      ev.preventDefault(); var i = sugIdx >= 0 ? sugIdx : 0; if (sugItems[i]) setPlace(sugItems[i]);
    } else if (ev.key === "Escape") closeSuggest();
  });
  $("find").addEventListener("input", function () { S.find = this.value.trim(); if (S.tab === "now") renderNow(); else if (S.tab === "year") renderYear(); });
  $("lang").addEventListener("change", function () { S.lang = this.value; store("lang", S.lang); renderAll(); });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeSheet(); });

  function locate() {
    if (!navigator.geolocation) { toast(T("locUnsupported")); return; }
    toast(T("locFinding"));
    navigator.geolocation.getCurrentPosition(function (pos) {
      var lat = pos.coords.latitude, lon = pos.coords.longitude;
      reverseGeocode(lat, lon).then(function (r) { setPlace({ name: r.name, region: r.region, lat: lat, lon: lon }); });
    }, function () { toast(T("locNo")); }, { timeout: 10000, maximumAge: 600000 });
  }

  /* ---------- start ---------- */
  var start = S.place || { name: "Vienna", region: "Austria", lat: 48.21, lon: 16.37, sample: true };
  setPlace(start);
})();
</script>

</body>
